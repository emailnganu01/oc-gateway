name: Build and Push to GHCR

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository }}   # → ghcr.io/emailnganu01/oc-gateway

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # GITHUB_TOKEN otomatis dapat izin push ke GHCR

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Login GHCR pakai GITHUB_TOKEN — TIDAK perlu PAT manual.
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.GHCR_IMAGE }}
          tags: |
            type=semver,pattern={{version}}          # tag v1.2.3 → :1.2.3
            type=raw,value=latest,enable={{is_default_branch}}  # main → :latest
            type=sha                                 # main → :sha-<hash>

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.GHCR_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.GHCR_IMAGE }}:buildcache,mode=max
          platforms: linux/amd64,linux/arm64
          provenance: false
          sbom: false